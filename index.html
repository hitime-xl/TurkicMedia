<style>
:root{--bg:#fff;--fg:#0f1419;--mut:#667085;--line:#e4e7ec;--card:#f7f9fb;--pri:#1f9fe8;--red:#e0245e}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--fg:#e7ecf1;--mut:#8a97a6;--line:#222b36;--card:#131a22;--pri:#3bb5ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr) 280px;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:16px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--pri);padding:6px 12px 14px}
.logo img{width:34px;height:34px;border-radius:8px}
nav button.n{background:none;border:0;color:var(--fg);font:inherit;font-size:16px;text-align:left;padding:10px 12px;border-radius:99px;cursor:pointer}
nav button.n:hover,nav button.n.on{background:var(--card);font-weight:700}
main{border-right:1px solid var(--line);min-width:0}
aside{padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
h2{margin:0;padding:14px 16px;font-size:18px;border-bottom:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:12px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--fg);border-color:var(--pri)}
.compose{padding:14px 16px;border-bottom:1px solid var(--line)}
textarea{width:100%;min-height:70px;resize:vertical;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:99px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.o{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.o.on{background:var(--fg);color:var(--bg)}
.post{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;overflow:hidden;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.pb{min-width:0;flex:1}
.nm{font-weight:700;cursor:pointer}.nm:hover{text-decoration:underline}
.hd{color:var(--mut)}
.bd{white-space:pre-wrap;overflow-wrap:anywhere;margin:2px 0 6px}
.tag{color:var(--pri);cursor:pointer}.tag:hover{text-decoration:underline}
.acts{display:flex;gap:18px;color:var(--mut);font-size:13px}
.acts button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:2px 0}
.acts .lk.on{color:var(--red)}.acts .dl:hover{color:var(--red)}
.badge{display:inline-block;background:var(--pri);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;vertical-align:middle;margin-left:4px}
.box{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.box h3{margin:0 0 8px;font-size:16px}
.tr{display:flex;justify-content:space-between;padding:6px 0;cursor:pointer}.tr:hover b{text-decoration:underline}
.tr small,.mut{color:var(--mut)}
.prof{padding:16px;border-bottom:1px solid var(--line)}
.stats{display:flex;gap:16px;margin-top:8px}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px}
.chip{background:var(--card);border-radius:99px;padding:4px 12px;cursor:pointer}
.auth{max-width:340px;margin:8vh auto;padding:24px;text-align:center}
.auth img{width:96px;height:96px;border-radius:20px}
.auth input{display:block;width:100%;margin:8px 0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
.auth .btn{width:100%;margin-top:6px}
.err{color:var(--red);min-height:20px;font-size:13px}
.lnk{color:var(--pri);cursor:pointer}
@media (max-width:820px){
.wrap{grid-template-columns:minmax(0,1fr);padding-bottom:64px}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);border-right:0;padding:6px;z-index:5}
.logo{display:none}nav button.n{padding:8px 10px;font-size:14px}
aside{display:none}main{border:0}}
</style>

const nameOf=id=>(S.prof[id]&&S.prof[id].name)||'Kullanıcı';
const handle=id=>'@'+tl(nameOf(id)).replace(/[^\p{L}\p{N}]+/gu,'');
const avatar=id=>{const p=S.prof[id]||{};return `<div class="av" data-u="${esc(id)}" style="background:${colOf(id)}">${p.photo?`<img src="${esc(p.photo)}" alt="" referrerpolicy="no-referrer">`:esc(nameOf(id)[0].toUpperCase())}</div>`};
const ago=t=>{const s=(Date.now()-t)/1000;if(s<60)return 'şimdi';if(s<3600)return Math.floor(s/60)+' dk';if(s<86400)return Math.floor(s/3600)+' sa';return new Date(t).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})};
const body=t=>esc(t).replace(/#([\p{L}\p{N}_]+)/gu,(m,h)=>`<span class="tag" data-t="${tl(h)}">#${h}</span>`);
const likeCount=pid=>S.likes.filter(l=>l.pid===pid).length;
const liked=pid=>S.likes.some(l=>l.pid===pid&&l.uid===S.me);
const following=id=>S.follows.some(f=>f.from===S.me&&f.to===id);
const followers=id=>S.follows.filter(f=>f.to===id).length;
const followingN=id=>S.follows.filter(f=>f.from===id).length;
const tagsOf=t=>[...new Set([...t.matchAll(/#([\p{L}\p{N}_]+)/gu)].map(m=>tl(m[1])))];
const hot=p=>(1+2*likeCount(p.id))/Math.pow((Date.now()-p.t)/36e5+2,1.2);
const byNew=a=>a.slice().sort((x,y)=>y.t-x.t);
function trending(){const m={},cut=Date.now()-7*864e5;
 S.posts.filter(p=>p.t>cut).forEach(p=>(p.tags||[]).forEach(t=>{const o=m[t]||(m[t]={t,n:0,sc:0});o.n++;o.sc+=1+2*likeCount(p.id)}));
 return Object.values(m).sort((a,b)=>b.sc-a.sc).slice(0,10)}

function postHtml(p){const mine=p.uid===S.me;
 return `<div class="post" data-id="${p.id}">${avatar(p.uid)}<div class="pb">
 <div><span class="nm" data-u="${esc(p.uid)}">${esc(nameOf(p.uid))}</span><span class="badge">Premium</span> <span class="hd">${esc(handle(p.uid))} · ${ago(p.t)}${p.edited?' · düzenlendi':''}</span></div>
 <div class="bd">${body(p.text)}</div>
 <div class="acts"><button class="lk ${liked(p.id)?'on':''}" data-a="like">${liked(p.id)?'♥':'♡'} ${likeCount(p.id)||''}</button>
 ${mine?'<button data-a="edit">Düzenle</button><button class="dl" data-a="del">🗑 Sil</button>':''}</div></div></div>`}
const list=(a,m)=>a.length?a.map(postHtml).join(''):`<div class="empty">${m}</div>`;

function render(){
 if(!S.me)return;
 const tx=$('#tx'),keep=tx?tx.value:'';
 const it=[['home','Ana Sayfa'],['explore','Keşfet'],['profile','Profil'],['premium','Premium']];
 const tr=trending();let h='';
 if(S.view==='home'){
  const ids=new Set(S.follows.filter(f=>f.from===S.me).map(f=>f.to));ids.add(S.me);
  const ps=S.tab==='all'?S.posts:S.posts.filter(p=>ids.has(p.uid));
  h=`<h2>Ana Sayfa</h2><div class="compose"><textarea id="tx" maxlength="${LIMIT}" placeholder="Neler oluyor? #etiket kullan"></textarea>
  <div class="row"><span class="mut" id="cnt">0/${LIMIT}</span><button class="btn" id="send" disabled>Paylaş</button></div></div>
  <div class="tabs"><button class="${S.tab==='all'?'on':''}" data-tb="all">Herkes</button><button class="${S.tab==='fol'?'on':''}" data-tb="fol">Takip ettiklerim</button></div>
  ${list(byNew(ps),S.tab==='fol'?'Henüz kimseyi takip etmiyorsun ya da paylaşım yok.':'İlk gönderiyi sen paylaş!')}`;
 }else if(S.view==='explore'){
  if(S.tag){h=`<h2>#${esc(S.tag)}</h2><div class="chips"><span class="chip" data-t="">← Keşfet'e dön</span></div>${list(S.posts.filter(p=>(p.tags||[]).includes(S.tag)).sort((a,b)=>hot(b)-hot(a)),'Bu etikette gönderi yok.')}`}
  else{h=`<h2>Keşfet</h2><div class="chips">${tr.map(x=>`<span class="chip" data-t="${esc(x.t)}">#${esc(x.t)} · ${x.n}</span>`).join('')||'<span class="mut">Etiketler burada görünecek.</span>'}</div>
   <div class="mut" style="padding:0 16px 8px">En çok etkileşim alan gönderiler</div>${list(S.posts.slice().sort((a,b)=>hot(b)-hot(a)).slice(0,30),'Henüz gönderi yok.')}`}
 }else if(S.view==='profile'){
  const id=S.pid||S.me,ps=byNew(S.posts.filter(p=>p.uid===id));
  h=`<h2>${esc(nameOf(id))}</h2><div class="prof"><div class="row" style="align-items:flex-start"><div style="display:flex;gap:12px;align-items:center">${avatar(id)}<div><b>${esc(nameOf(id))}</b><span class="badge">Premium</span><div class="hd">${esc(handle(id))}</div></div></div>
  ${id===S.me?'<button class="btn o" data-a="out">Çıkış yap</button>':`<button class="btn o ${following(id)?'on':''}" data-a="follow" data-u="${esc(id)}">${following(id)?'Takip ediliyor':'Takip et'}</button>`}</div>
  <div class="stats"><span><b>${followingN(id)}</b> <span class="mut">takip</span></span><span><b>${followers(id)}</b> <span class="mut">takipçi</span></span><span><b>${ps.length}</b> <span class="mut">gönderi</span></span></div></div>
  ${list(ps,'Henüz gönderi yok.')}`;
 }else{h=`<h2>Premium — hepsi ücretsiz</h2><div class="prof"><p>TurkicMedia'da herkes Premium. Abonelik yok, ödeme yok.</p><ul>
  <li>✓ ${LIMIT} karaktere kadar uzun gönderi</li><li>✓ Gönderi düzenleme ve silme</li><li>✓ Premium rozeti</li><li>✓ Keşfet ve gündem etiketleri</li><li>✓ Takip / takipçi sistemi</li><li>✓ Reklamsız akış</li></ul></div>`}
 $('#app').innerHTML=`<div class="wrap"><nav><div class="logo"><img src="${LOGO}" alt="">TurkicMedia</div>${it.map(([k,l])=>`<button class="n ${S.view===k?'on':''}" data-v="${k}">${l}</button>`).join('')}</nav>
 <main>${h}</main><aside><div class="box"><input id="q" placeholder="#etiket ara" value="${esc(S.q)}" style="width:100%;border:0;background:transparent;color:var(--fg);font:inherit;outline:0"></div>
 <div class="box"><h3>Gündemdekiler</h3>${tr.length?tr.map((x,i)=>`<div class="tr" data-t="${esc(x.t)}"><span><small>${i+1} · Gündem</small><br><b>#${esc(x.t)}</b></span><small>${x.n} gönderi</small></div>`).join(''):'<span class="mut">Henüz etiket yok.</span>'}</div></aside></div>`;
 const n=$('#tx');if(n){n.oninput=()=>{$('#cnt').textContent=n.value.length+'/'+LIMIT;$('#send').disabled=!n.value.trim()};if(keep){n.value=keep;n.oninput()}}
}
let t0;const refresh=()=>{clearTimeout(t0);t0=setTimeout(render,60)};

function authView(msg='',reg=false){
 $('#app').innerHTML=`<div class="auth"><img src="${LOGO}" alt=""><h1 style="margin:10px 0 2px">TurkicMedia</h1><p class="mut">${reg?'Hesap oluştur':'Giriş yap'}</p>
 ${reg?'<input id="nm" placeholder="Kullanıcı adı" maxlength="30">':''}<input id="em" type="email" placeholder="E-posta"><input id="pw" type="password" placeholder="Şifre (en az 6 karakter)">
 <div class="err" id="er">${esc(msg)}</div><button class="btn" id="go">${reg?'Kayıt ol':'Giriş yap'}</button>
 <button class="btn o" id="gg" style="margin-top:8px">Google ile devam et</button>
 <p class="mut">${reg?'Zaten hesabın var mı?':'Hesabın yok mu?'} <span class="lnk" id="sw">${reg?'Giriş yap':'Kayıt ol'}</span></p></div>`;
 const err=e=>{const m={'auth/invalid-credential':'E-posta veya şifre hatalı.','auth/email-already-in-use':'Bu e-posta zaten kayıtlı.','auth/weak-password':'Şifre en az 6 karakter olmalı.','auth/invalid-email':'Geçersiz e-posta.','auth/operation-not-allowed':'Bu giriş yöntemi Firebase\'de etkin değil.'};$('#er').textContent=m[e.code]||e.message};
 $('#sw').onclick=()=>authView('',!reg);
 $('#gg').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(err);
 $('#go').onclick=async()=>{const em=$('#em').value.trim(),pw=$('#pw').value;
  try{if(reg){const n=$('#nm').value.trim();if(!n)return $('#er').textContent='Kullanıcı adı gir.';
    const c=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(c.user,{displayName:n});await saveProfile(c.user,n)}
   else await signInWithEmailAndPassword(auth,em,pw)}catch(e){err(e)}};
}
const saveProfile=(u,n)=>setDoc(doc(db,'users',u.uid),{name:n||u.displayName||'Kullanıcı',photo:u.photoURL||''},{merge:true});

onAuthStateChanged(auth,async u=>{
 S.unsub.forEach(f=>f());S.unsub=[];
 if(!u){S.me=null;return authView()}
 S.me=u.uid;
 try{await saveProfile(u,u.displayName)}catch(e){}
 const sub=(c,k,f)=>S.unsub.push(onSnapshot(collection(db,c),s=>{S[k]=f?Object.fromEntries(s.docs.map(d=>[d.id,d.data()])):s.docs.map(d=>({id:d.id,...d.data()}));refresh()},e=>console.error(c,e)));
 sub('posts','posts');sub('likes','likes');sub('follows','follows');sub('users','prof',true);
 render();
});

document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-a],[data-v],[data-t],[data-u],[data-tb],#send');if(!el||!S.me)return;
 const a=el.dataset.a,pe=el.closest('.post'),pid=pe&&pe.dataset.id,P=S.posts.find(p=>p.id===pid);
 try{
 if(el.id==='send'){const tx=$('#tx'),text=tx.value.trim().slice(0,LIMIT);if(!text)return;el.disabled=true;tx.value='';
  await addDoc(collection(db,'posts'),{uid:S.me,text,tags:tagsOf(text),t:Date.now()})}
 else if(a==='like'){const r=doc(db,'likes',pid+'_'+S.me);liked(pid)?await deleteDoc(r):await setDoc(r,{pid,uid:S.me})}
 else if(a==='del'){if(confirm('Bu gönderi kalıcı olarak silinsin mi?'))await deleteDoc(doc(db,'posts',pid))}
 else if(a==='edit'){const n=prompt('Gönderiyi düzenle',P.text);if(n&&n.trim()){const text=n.trim().slice(0,LIMIT);await updateDoc(doc(db,'posts',pid),{text,tags:tagsOf(text),edited:true})}}
 else if(a==='follow'){const u=el.dataset.u,r=doc(db,'follows',S.me+'_'+u);following(u)?await deleteDoc(r):await setDoc(r,{from:S.me,to:u})}
 else if(a==='out'){await signOut(auth)}
 else if(el.dataset.v){S.view=el.dataset.v;S.pid=null;S.tag=null;render();scrollTo(0,0)}
 else if(el.dataset.tb){S.tab=el.dataset.tb;render()}
 else if(el.classList.contains('tag')||el.classList.contains('tr')||el.classList.contains('chip')){S.view='explore';S.tag=el.dataset.t||null;render();scrollTo(0,0)}
 else if(el.dataset.u&&!a){S.view='profile';S.pid=el.dataset.u;render();scrollTo(0,0)}
 }catch(err){alert('İşlem başarısız: '+(err.message||err.code))}
});
document.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key==='Enter'){const t=tl(e.target.value.replace('#','').trim());if(t){S.q=e.target.value;S.view='explore';S.tag=t;render()}}});
</script>
</body>
</html>
